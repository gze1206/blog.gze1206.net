name: ci

on:
  # PR 브랜치의 코드(테스트, lifecycle 스크립트)를 실행한다. 비밀값과 쓰기 권한이 생기는 pull_request_target 으로 바꾸지 않는다.
  pull_request:
  push:
    branches: [v4, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      # 변경 영향 범위만 돈다. 계약은 두 앱이 모두 의존하므로 바뀌면 둘 다 돈다.
      - name: verify (affected)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # 브랜치를 새로 만든 push 는 before 가 0 SHA 다. 비교 대상이 없으므로 전체를 돈다.
          if [ -z "${BASE//0/}" ]; then F="./**"; else F="...[${BASE}]"; fi
          # 루트 패키지는 뺀다. 루트 스크립트가 다시 `pnpm -r` 로 같은 앱을 돌려 빌드가 겹치기 때문이다.
          pnpm --filter "$F" --filter '!{.}' --if-present typecheck
          pnpm --filter "$F" --filter '!{.}' --if-present lint
          pnpm format:check
          pnpm --filter "$F" --filter '!{.}' --if-present test
          pnpm --filter "$F" --filter '!{.}' --if-present build
          pnpm boundaries
      # 계약 테스트는 영향 범위와 무관하게 항상 돈다.
      - run: pnpm --filter @gze1206/content-contract test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gze1206/blog exec playwright install --with-deps chromium
      - run: pnpm --filter @gze1206/workbench exec playwright install --with-deps chromium
      - run: pnpm --filter @gze1206/workbench build
      # 블로그 e2e 는 playwright.config.ts 의 webServer 가 직접 빌드한다.
      - run: pnpm e2e

  spec-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm spec:check

  tdd-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm tdd:evidence --base "origin/$BASE_REF"
