         타일 색은 라이트·다크 모두 같다 — 브랜드 색은 테마가 아니라 정체성이다. -->
    <rect width="100" height="100" rx="24" fill="#3D7364" />
    <g transform="translate(50 51) scale(0.74) translate(-50 -50)">
        <g stroke="#FCF9F4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 43 30 25l-12-2M30 25l4-16M50 43 70 25l12-2M70 25l-4-16" />
            <path d="M34 9 38 5M66 9 62 5" />
